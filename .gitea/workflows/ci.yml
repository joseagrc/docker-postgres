name: Build Postgres Docker Image

on:
  push:
    branches:
      - '*'

jobs:
  build:
    env:
      DISTRO: "alpine"
      DISTRO_VARIANT: "3.22"
      POSTGRES_VERSION: "17.5"
      POSTGRES_ZABBIX_PLUGIN_VERSION: "7.2.9"
      build_file: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Prepare
        id: prep
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
              git_branch=${GITHUB_REF#refs/heads/}

              # Set branch_tag and TAG_VERSION based on the branch
              if [[ "${git_branch}" == "main" || "${git_branch}" == "master" ]]; then
                  branch_tag="${GITHUB_REPOSITORY}:latest"
              else
                  branch_tag="${GITHUB_REPOSITORY}:${git_branch}"
              fi

              echo "branch_tag=${branch_tag}" >> $GITHUB_ENV
          fi

          # Combine branch tag and git tag if both exist
          if [ -n "${branch_tag}" ] && [ -n "${git_tag}" ]; then
              image_tags="${branch_tag},${git_tag}"
          else
              image_tags="${branch_tag}${git_tag}"
          fi

          # Set DockerHub repo and image tags
          gcr_images=$(echo "${image_tags}" | sed "s|${GITHUB_REPOSITORY}|${{ secrets.REPO_URL }}/${GITHUB_REPOSITORY/docker-/}|g")
          echo "container_images=${gcr_images}" >> $GITHUB_OUTPUT                                                                              

      - name: Label
        id: label
        run: |
          image_name=${GITHUB_REPOSITORY/docker-/}
          if [ -f "${{ env.build_file }}" ] ; then
              sed -i "/FROM .*/a LABEL solutema.${image_name}.git_commit=\"${GITHUB_SHA}\"" ${{ env.build_file }}
              sed -i "/FROM .*/a LABEL solutema.${image_name}.git_committed_by=\"${GITHUB_ACTOR}\"" ${{ env.build_file }}
              sed -i "/FROM .*/a LABEL solutema.${image_name}.image_build_date=\"$(TZ=America/Santo_Domingo date +'%Y-%m-%d %H:%M:%S')\"" ${{ env.build_file }}
          fi                                                                                          

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3

      - name: Log in to the Gitea Container registry
        id: login-gitea
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REPO_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_TOKEN }}

      - name: Build
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./${{ env.build_file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.prep.outputs.container_images }}
          build-args: |
             REPO_URL=${{ secrets.REPO_URL }}
             REPO_USERNAME=${{ secrets.REPO_USERNAME }}
             DISTRO=${{ env.DISTRO }}
             DISTRO_VARIANT=${{ env.DISTRO_VARIANT }}
             POSTGRES_VERSION=${{ env.POSTGRES_VERSION }}
             POSTGRES_ZABBIX_PLUGIN_VERSION=${{ env.POSTGRES_ZABBIX_PLUGIN_VERSION }}             
    